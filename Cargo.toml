[workspace]
resolver = "3"
members = ["execution/wire", "execution/host-agent", "execution/guest-agent"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/OWNER/agent-compute-fabric"
publish = false

# Versions below were resolved against the crates.io sparse index on 2026-10-09 and re-verified on 2026-10-17 (see docs/DEPENDENCY_PROVENANCE.md).
[workspace.dependencies]
acf-wire = { path = "execution/wire" }
async-trait = "0.1.92"
base64 = "0.23.1"
cap-std = "4.0.3"
clap = { version = "4.6.7", features = ["derive"] }
crc32fast = "1.5.2"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
proptest = "1.12.0"
rustix = { version = "1.1.5", features = ["fs", "process", "thread", "mount", "system", "time", "pipe", "event"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.0.0"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "process", "signal", "sync"] }
tokio-util = "0.7.20"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.28.0", features = ["v7", "serde"] }
vsock = "0.5.4"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.dev]
debug = "line-tables-only"
