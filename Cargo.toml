[workspace]
resolver = "3"
members = ["execution/wire", "execution/traffic", "execution/host-agent", "execution/guest-agent"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.100"
license = "Apache-2.0"
publish = false

# Versions below were resolved against the crates.io registry API on 2026-11-18 (see docs/DEPENDENCY_PROVENANCE.md).
[workspace.dependencies]
acf-traffic = { path = "execution/traffic" }
acf-wire = { path = "execution/wire" }
async-trait = "0.1.92"
base64 = "0.23.1"
cap-std = "4.0.3"
clap = { version = "4.6.8", features = ["derive"] }
crc32fast = "1.5.5"
hex = "0.4.3"
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
proptest = "1.12.0"
# Test-only (feature `testing`): certificates for the mutual-TLS tests. Same crypto provider as rustls.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rustix = { version = "1.1.6", features = ["fs", "process", "thread", "mount", "system", "time", "pipe", "event", "net"] }
# TLS 1.3 only: the `tls12` feature is deliberately off, so no TLS 1.2 code is compiled into the host.
rustls = { version = "0.23.46", default-features = false, features = ["std", "aws_lc_rs"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde-saphyr = "2.1.1"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "process", "signal", "sync"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["aws_lc_rs"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.29.3", features = ["v7", "serde"] }
vsock = "0.5.5"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

[profile.dev]
debug = "line-tables-only"
