components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: A platform API key. Never accepted in a URL.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: One key per intent, created before the first attempt and reused by every retry. Characters 0x21 to 0x7E,
        compared byte for byte.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: The `ETag` of the sandbox as last read. A stronger precondition than the generation.
      schema:
        type: string
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: W3C trace context. An invalid value is ignored, never an error.
      schema:
        type: string
  headers:
    RequestId:
      description: The request id. Quote it when asking for help.
      schema:
        type: string
    Location:
      description: Where to follow the operation.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before asking again.
      schema:
        type: integer
    IdempotentReplayed:
      description: '`true` when the answer reports work that existed before this request.'
      schema:
        type: string
        enum:
        - 'true'
    ETag:
      description: Opaque validator of the resource. Compare for equality only.
      schema:
        type: string
        pattern: ^"r[0-9]{1,20}\.[0-9a-f]{12}"$
  responses:
    Problem400:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: INVALID_REQUEST.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem401:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: UNAUTHENTICATED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        WWW-Authenticate:
          schema:
            type: string
          description: The challenge.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: PERMISSION_DENIED, SAFETY_CONTROL_DENIED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: NOT_FOUND.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: STATE_CONFLICT, QUARANTINED, REQUEST_IN_PROGRESS,
        INTEGRITY_FAILURE, INCOMPATIBLE_RUNTIME.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem410:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: CURSOR_EXPIRED, OUTCOME_LOST.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem412:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: REVISION_CONFLICT.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem413:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: REQUEST_TOO_LARGE.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem422:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: IDEMPOTENCY_CONFLICT, UNSUPPORTED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: RATE_LIMITED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem500:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: INTERNAL_ERROR.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem503:
      description: 'An error answer. `code` is authoritative; this status is a hint. Codes: RESOURCE_EXHAUSTED, HOST_NOT_SERVING,
        CLOCK_SKEW, UPSTREAM_UNAVAILABLE, OUTCOME_UNRESOLVED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Actor:
      additionalProperties: false
      description: Who asked for an operation, as the host recorded it.
      properties:
        principal_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Principal Id
        agent_label:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Agent Label
          x-provenance: THIRD_PARTY
      title: Actor
      type: object
    AgentCredential:
      additionalProperties: false
      properties:
        credential_id:
          title: Credential Id
          type: string
        kind:
          title: Kind
          type: string
        label:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Label
          x-provenance: THIRD_PARTY
        display_prefix:
          title: Display Prefix
          type: string
        status:
          title: Status
          type: string
        issued_at:
          title: Issued At
          type: string
        expires_at:
          title: Expires At
          type: string
        narrowing:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          default: null
          title: Narrowing
        secret:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: The credential itself. Present once, in the answer to minting, and never again.
          title: Secret
      required:
      - credential_id
      - kind
      - display_prefix
      - status
      - issued_at
      - expires_at
      title: AgentCredential
      type: object
    AgentCredentialList:
      additionalProperties: false
      properties:
        items:
          items:
            $ref: '#/components/schemas/AgentCredential'
          title: Items
          type: array
      required:
      - items
      title: AgentCredentialList
      type: object
    AllowEntryView:
      additionalProperties: false
      properties:
        name:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Name
        network:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Network
        ports:
          items:
            $ref: '#/components/schemas/PortRangeView'
          title: Ports
          type: array
      required:
      - ports
      title: AllowEntryView
      type: object
    AllowName:
      additionalProperties: false
      description: Outbound TLS to an exact DNS name, on the listed ports.
      properties:
        name:
          maxLength: 253
          minLength: 1
          title: Name
          type: string
        ports:
          items:
            $ref: '#/components/schemas/PortRange'
          maxItems: 64
          minItems: 1
          title: Ports
          type: array
      required:
      - name
      - ports
      title: AllowName
      type: object
    AllowNetwork:
      additionalProperties: false
      description: Outbound TCP to an IPv4 network in CIDR form, on the listed ports.
      properties:
        network:
          maxLength: 18
          minLength: 9
          title: Network
          type: string
        ports:
          items:
            $ref: '#/components/schemas/PortRange'
          maxItems: 64
          minItems: 1
          title: Ports
          type: array
      required:
      - network
      - ports
      title: AllowNetwork
      type: object
    Ceilings:
      additionalProperties: false
      properties:
        vcpus:
          title: Vcpus
          type: integer
        memory_mib:
          title: Memory Mib
          type: integer
        disk_mib:
          title: Disk Mib
          type: integer
        execution_timeout_seconds:
          title: Execution Timeout Seconds
          type: integer
        sandbox_lifetime_seconds:
          title: Sandbox Lifetime Seconds
          type: integer
        allowlist_entries:
          title: Allowlist Entries
          type: integer
      required:
      - vcpus
      - memory_mib
      - disk_mib
      - execution_timeout_seconds
      - sandbox_lifetime_seconds
      - allowlist_entries
      title: Ceilings
      type: object
    CredentialView:
      additionalProperties: false
      properties:
        credential_id:
          title: Credential Id
          type: string
        kind:
          title: Kind
          type: string
        agent_label:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Agent Label
        expires_at:
          title: Expires At
          type: string
      required:
      - credential_id
      - kind
      - expires_at
      title: CredentialView
      type: object
    Durations:
      additionalProperties: false
      properties:
        guest_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Guest Ms
          x-provenance: GUEST_REPORTED
        wall_ms:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Wall Ms
          x-provenance: HOST_OBSERVED
      title: Durations
      type: object
    ExecSpec:
      additionalProperties: false
      description: 'Body of ``POST …/sandboxes/{sandbox}/executions``: one command, as an argument vector.'
      properties:
        expected_generation:
          anyOf:
          - minimum: 1
            type: integer
          - const: current
            type: string
          description: 'The generation the request acts on. An integer: the request acts on that generation or is refused
            with REVISION_CONFLICT. The literal `current`: the caller chooses, explicitly, to act on whatever generation is
            current when the platform reads it; the value read is recorded with the request.'
          title: Expected Generation
        argv:
          description: Executed directly, never through a shell. Use ["/bin/sh", "-c", "…"] to ask for one.
          items:
            type: string
          maxItems: 4096
          minItems: 1
          title: Argv
          type: array
        cwd:
          anyOf:
          - maxLength: 4096
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Cwd
        env:
          maxProperties: 1024
          patternProperties:
            ^[A-Za-z_][A-Za-z0-9_]{0,254}$:
              type: string
          title: Env
          type: object
        secret_env:
          description: Environment variables delivered by reference. Needs the feature `secret_injection`.
          maxProperties: 1024
          patternProperties:
            ^[A-Za-z_][A-Za-z0-9_]{0,254}$:
              $ref: '#/components/schemas/SecretReference'
          title: Secret Env
          type: object
        timeout_seconds:
          anyOf:
          - maximum: 604800
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Timeout Seconds
        max_pids:
          anyOf:
          - maximum: 4194304
            minimum: 1
            type: integer
          - type: 'null'
          default: null
          title: Max Pids
        max_stdout_bytes:
          anyOf:
          - maximum: 1073741824
            minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Max Stdout Bytes
        max_stderr_bytes:
          anyOf:
          - maximum: 1073741824
            minimum: 0
            type: integer
          - type: 'null'
          default: null
          title: Max Stderr Bytes
      required:
      - expected_generation
      - argv
      title: ExecSpec
      type: object
    Execution:
      additionalProperties: false
      description: One command run in one generation of one sandbox.
      properties:
        execution_id:
          title: Execution Id
          type: string
        operation_id:
          title: Operation Id
          type: string
        project:
          title: Project
          type: string
        sandbox_id:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Sandbox Id
        generation:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Generation
        state:
          description: State of the operation that runs the command.
          title: State
          type: string
        state_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: State Raw
        terminal:
          title: Terminal
          type: boolean
        status:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Status
          x-provenance: GUEST_REPORTED
        status_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Status Raw
        exit_code:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Exit Code
          x-provenance: GUEST_REPORTED
        signal:
          anyOf:
          - type: integer
          - type: 'null'
          default: null
          title: Signal
          x-provenance: GUEST_REPORTED
        durations:
          anyOf:
          - $ref: '#/components/schemas/Durations'
          - type: 'null'
          default: null
        stdout:
          anyOf:
          - $ref: '#/components/schemas/OutputSummary'
          - type: 'null'
          default: null
          x-provenance: GUEST_REPORTED
        stderr:
          anyOf:
          - $ref: '#/components/schemas/OutputSummary'
          - type: 'null'
          default: null
          x-provenance: GUEST_REPORTED
        host_backstop_fired:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Host Backstop Fired
          x-provenance: HOST_OBSERVED
        runtime_ended:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          title: Runtime Ended
          x-provenance: HOST_OBSERVED
        evidence_status:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Evidence Status
          x-provenance: HOST_OBSERVED
        evidence_status_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Evidence Status Raw
        note:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Note
          x-provenance: HOST_OBSERVED
        provenance:
          additionalProperties:
            type: string
          description: 'The provenance label of each field of this result: HOST_OBSERVED or GUEST_REPORTED.'
          title: Provenance
          type: object
      required:
      - execution_id
      - operation_id
      - project
      - state
      - terminal
      title: Execution
      type: object
    Failure:
      additionalProperties: false
      description: Why an operation, a sandbox or a snapshot failed, as the host reported it.
      properties:
        code:
          description: A failure class of the public vocabulary, or UNRECOGNIZED.
          title: Code
          type: string
        code_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: The host's value, when `code` is UNRECOGNIZED.
          title: Code Raw
        retry:
          title: Retry
          type: string
        message:
          title: Message
          type: string
        side_effect:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Side Effect
        side_effect_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          description: The host's value, when `side_effect` is UNRECOGNIZED.
          title: Side Effect Raw
      required:
      - code
      - retry
      - message
      title: Failure
      type: object
    Grant:
      additionalProperties: false
      description: What a role allows, or what a credential narrows it to. Whatever is not mentioned is denied.
      properties:
        schema_version:
          const: 1
          default: 1
          title: Schema Version
          type: integer
        methods:
          items:
            type: string
          maxItems: 64
          title: Methods
          type: array
        images:
          description: Image aliases; `*` allows every image.
          items:
            type: string
          maxItems: 256
          title: Images
          type: array
        network:
          $ref: '#/components/schemas/GrantNetwork'
        ceilings:
          $ref: '#/components/schemas/GrantCeilings'
        mint_agent_credentials:
          default: false
          title: Mint Agent Credentials
          type: boolean
      required:
      - ceilings
      title: Grant
      type: object
    GrantCeilings:
      additionalProperties: false
      description: Ceilings below the host's. A ceiling above the host's is legal and simply never reached.
      properties:
        vcpus:
          maximum: 255
          minimum: 1
          title: Vcpus
          type: integer
        memory_mib:
          maximum: 4194304
          minimum: 1
          title: Memory Mib
          type: integer
        disk_mib:
          maximum: 268435456
          minimum: 1
          title: Disk Mib
          type: integer
        execution_timeout_seconds:
          maximum: 604800
          minimum: 1
          title: Execution Timeout Seconds
          type: integer
        sandbox_lifetime_seconds:
          maximum: 31536000
          minimum: 1
          title: Sandbox Lifetime Seconds
          type: integer
      required:
      - vcpus
      - memory_mib
      - disk_mib
      - execution_timeout_seconds
      - sandbox_lifetime_seconds
      title: GrantCeilings
      type: object
    GrantDestination:
      additionalProperties: false
      description: 'One destination a grant allows: an exact name, a suffix rule ``*.<suffix>``, or an IPv4 network.'
      properties:
        name:
          anyOf:
          - maxLength: 253
            minLength: 1
            type: string
          - type: 'null'
          default: null
          title: Name
        suffix:
          anyOf:
          - maxLength: 255
            minLength: 3
            pattern: ^\*\.[A-Za-z0-9.-]+$
            type: string
          - type: 'null'
          default: null
          title: Suffix
        network:
          anyOf:
          - maxLength: 18
            minLength: 9
            type: string
          - type: 'null'
          default: null
          title: Network
        ports:
          items:
            $ref: '#/components/schemas/PortRange'
          maxItems: 64
          minItems: 1
          title: Ports
          type: array
      required:
      - ports
      title: GrantDestination
      type: object
    GrantNetwork:
      additionalProperties: false
      properties:
        modes:
          items:
            $ref: '#/components/schemas/NetworkMode'
          maxItems: 2
          title: Modes
          type: array
        destinations:
          items:
            $ref: '#/components/schemas/GrantDestination'
          maxItems: 256
          title: Destinations
          type: array
      title: GrantNetwork
      type: object
    Image:
      additionalProperties: false
      properties:
        alias:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Alias
        digest:
          description: Identity of the image the sandbox runs.
          title: Digest
          type: string
      required:
      - digest
      title: Image
      type: object
    Info:
      additionalProperties: false
      description: 'Platform info. Without a credential: the API versions and whether the platform itself serves.'
      properties:
        api_versions:
          items:
            type: string
          title: Api Versions
          type: array
        serving:
          title: Serving
          type: boolean
        ready:
          anyOf:
          - type: boolean
          - type: 'null'
          default: null
          description: Whether the platform accepts granting work now.
          title: Ready
        not_ready_reasons:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Not Ready Reasons
        platform_features:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Platform Features
        host_features:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          default: null
          title: Host Features
        parameters:
          anyOf:
          - additionalProperties:
              anyOf:
              - type: integer
              - type: number
              - type: boolean
            type: object
          - type: 'null'
          default: null
          title: Parameters
        ceilings:
          anyOf:
          - $ref: '#/components/schemas/Ceilings'
          - type: 'null'
          default: null
      required:
      - api_versions
      - serving
      title: Info
      type: object
    MintAgentCredentialSpec:
      additionalProperties: false
      description: Body of ``POST …/agent-credentials``.
      properties:
        label:
          description: Fixed for the life of the credential.
          pattern: ^[A-Za-z0-9_.-]{1,64}$
          title: Label
          type: string
        lifetime_seconds:
          maximum: 31536000
          minimum: 60
          title: Lifetime Seconds
          type: integer
        narrowing:
          anyOf:
          - $ref: '#/components/schemas/Grant'
          - type: 'null'
          default: null
          description: 'A subset of the minting credential''s effective grants. Absent: the `agent` template.'
      required:
      - label
      - lifetime_seconds
      title: MintAgentCredentialSpec
      type: object
    NetworkAllowlist:
      additionalProperties: false
      description: Outbound connections to the listed destinations only.
      properties:
        mode:
          const: allowlist
          title: Mode
          type: string
        entries:
          items:
            anyOf:
            - $ref: '#/components/schemas/AllowName'
            - $ref: '#/components/schemas/AllowNetwork'
          maxItems: 256
          title: Entries
          type: array
      required:
      - mode
      - entries
      title: NetworkAllowlist
      type: object
    NetworkMode:
      enum:
      - none
      - allowlist
      title: NetworkMode
      type: string
    NetworkNone:
      additionalProperties: false
      description: No network device exists in the sandbox.
      properties:
        mode:
          const: none
          default: none
          title: Mode
          type: string
      title: NetworkNone
      type: object
    NetworkView:
      additionalProperties: false
      properties:
        mode:
          title: Mode
          type: string
        mode_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Mode Raw
        entries:
          items:
            $ref: '#/components/schemas/AllowEntryView'
          title: Entries
          type: array
      required:
      - mode
      title: NetworkView
      type: object
    Operation:
      additionalProperties: false
      description: One accepted mutation. Exactly one host operation stands behind it.
      properties:
        operation_id:
          title: Operation Id
          type: string
        project:
          title: Project
          type: string
        type:
          title: Type
          type: string
        type_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Type Raw
        state:
          title: State
          type: string
        state_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: State Raw
        terminal:
          description: False for every state this version does not know.
          title: Terminal
          type: boolean
        effect:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Effect
        effect_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Effect Raw
        failure:
          anyOf:
          - $ref: '#/components/schemas/Failure'
          - type: 'null'
          default: null
        cleanup:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Cleanup
        cleanup_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Cleanup Raw
        cancelled_by:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Cancelled By
        cancelled_by_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Cancelled By Raw
        target:
          $ref: '#/components/schemas/OperationTarget'
        result:
          anyOf:
          - $ref: '#/components/schemas/OperationResult'
          - type: 'null'
          default: null
        initiated_by:
          title: Initiated By
          type: string
        initiated_by_raw:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Initiated By Raw
        actor:
          anyOf:
          - $ref: '#/components/schemas/Actor'
          - type: 'null'
          default: null
        created_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Created At
        updated_at:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Updated At
        replayed:
          default: false
          description: True when this answer reports work that existed before the request that received it.
          title: Replayed
          type: boolean
        recorded:
          default: false
          description: True when the host no longer holds the operation and this is the terminal outcome the platform recorded
            while it did.
          title: Recorded
          type: boolean
        idempotency_key_digest:
          anyOf:
          - type: string
          - type: 'null'
          default: null
          title: Idempotency Key Digest
      required:
      - operation_id
      - project
      - type
      - state
      - terminal
      - target
      - initiated_by
      title: Operation
      type: object
    OperationList:
      additionalProperties: false
