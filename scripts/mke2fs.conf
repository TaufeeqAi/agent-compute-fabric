# mke2fs.conf used by scripts/create-rootfs.sh (via MKE2FS_CONFIG).
#
# Why a pinned config instead of the build host's /etc/mke2fs.conf: the guest kernel is NOT the build
# host's kernel. A recent e2fsprogs enables features on new filesystems (orphan_file in 1.47, for
# example) that a Firecracker guest kernel such as 5.10 does not understand; an unknown ro_compat
# feature makes the kernel mount the root filesystem READ-ONLY, which shows up much later as a
# mysterious "read-only file system" inside the sandbox. So the feature set is spelled out and limited
# to what Linux >= 5.10 supports.
#
# resize_inode matters: the guest grows its root filesystem online at boot (resize2fs) from the image's
# compact size to the disk the sandbox was given; resize_inode reserves the descriptor blocks that make
# that possible (up to 1024x growth).

[defaults]
	base_features = sparse_super,large_file,filetype,resize_inode,dir_index,ext_attr
	blocksize = 4096
	inode_size = 256
	inode_ratio = 8192
	enable_periodic_fsck = 0

[fs_types]
	ext4 = {
		features = has_journal,extent,huge_file,flex_bg,metadata_csum,64bit,dir_nlink,extra_isize
		inode_size = 256
	}
