[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "acf-mcp-gateway"
dynamic = ["version"]
description = "The MCP adapter of Agent Compute Fabric: an edge process that frames MCP messages (revision 2026-07-28, Streamable HTTP) and relays them to the core over the command interface."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Agent Compute Fabric contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
# This process reads untrusted bytes, so every dependency is supply-chain surface. Two are declared:
# the official MCP SDK, which owns the protocol's message shapes and its Streamable HTTP transport, and
# acf-api, for the command interface and the edge configuration it shares with the REST adapter. The
# HTTP stack this package imports directly (uvicorn, starlette) and pydantic are acf-api's own
# dependencies and are bounded by its ranges, so the two edge adapters of a deployment cannot drift
# apart. The floor of `mcp` is the release found on PyPI on 2026-11-19 and the only one this package
# was tested with; the cap is the next incompatible line. The lock file fixes every version and every
# file by its hash.
dependencies = [
    "mcp>=2.3.0,<3",
    # The command interface between the two packages is versioned on the wire, and a deployment installs
    # both from one checkout. The range says what was tested together: the minor line of acf-api this
    # release was built beside.
    "acf-api>=0.3.0,<0.4",
]

[project.scripts]
acf-mcp = "acf_mcp.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.15",
    "httpx2>=2.16.2",
    "types-PyYAML>=6.0.12.20261113",
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

# What a cached build of this package depends on. uv watches only pyproject.toml by default, and this
# package's version and all of its code live under src/: without this, an install that is not editable
# (a deployment, or a wheel built for a release) could be given a build of an older source tree.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]

[tool.uv.sources]
acf-api = { path = "../api", editable = true }

[tool.hatch.version]
path = "src/acf_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/acf_mcp"]

[tool.hatch.build.targets.sdist]
include = ["src/acf_mcp", "tests", "README.md", "pyproject.toml", "uv.lock"]

# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "PERF", "PL", "TID",
    "T20", "ARG", "S", "ANN", "ERA", "PIE", "RET", "TRY", "FBT", "DTZ", "ISC", "ICN", "G", "LOG", "ASYNC",
]
ignore = [
    "TRY003",  # explicit messages in exception constructors are fine
    "RET505",  # explicit else after return is sometimes clearer
    "TRY300",  # a return inside try is the clearest form of "this is what success returns"
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "PLR2004", "ANN", "ARG", "FBT", "T20", "PLR0915", "SLF001", "PLC0415"]

[tool.ruff.lint.isort]
known-first-party = ["acf_api", "acf_mcp"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# An edge process holds nothing. A static rule, beside the test that walks the import graph.
"acf_api.core".msg = "the MCP adapter is an edge process: it never imports acf_api.core"

# --------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60

[tool.coverage.run]
source = ["acf_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
