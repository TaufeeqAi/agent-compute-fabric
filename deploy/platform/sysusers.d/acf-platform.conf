# systemd-sysusers: the identities of the developer platform.
#   install -D -m 0644 deploy/platform/sysusers.d/acf-platform.conf /etc/sysusers.d/acf-platform.conf && systemd-sysusers acf-platform.conf
#
# Three accounts, because the platform is three roles that must not be able to stand in for one another.
# Ids are allocated by the system ("-"). Nothing has a home directory or a shell.
#
#Type Name         ID  GECOS                                               Home  Shell
#
# The core: the only account that can read the host private key, the fingerprint key, the store and the
# security journal. Before it serves, the core checks that no edge account below could read any of them,
# by its own id or through any of its groups, and refuses to start otherwise.
u     acf-core     -   "ACF platform core"                                 -     -

# The edges: the processes that read the bytes callers send. One account for each adapter, so that
# neither can read the other's TLS key or its memory. Each owns nothing but that key.
u     acf-rest     -   "ACF platform REST edge (unprivileged)"             -     -
u     acf-mcp      -   "ACF platform agent-protocol edge (unprivileged)"   -     -

# The group of the command socket: who may connect to the core. Membership opens the socket and nothing
# else; the core still checks the uid the kernel reports for every peer against `edge.users` in its
# configuration. The core is a member because an unprivileged process can hand a file only to a group
# it belongs to.
g     acf-command  -   -
m     acf-core     acf-command
m     acf-rest     acf-command
m     acf-mcp      acf-command
