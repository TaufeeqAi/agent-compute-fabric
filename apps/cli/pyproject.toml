[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[project]
name = "acf-cli"
dynamic = ["version"]
description = "acf-local: command-line client for the Agent Compute Fabric Phase 1 host agent."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Agent Compute Fabric contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
# Deliberately tiny runtime surface: this process talks to a privileged socket, so every
# dependency is supply-chain surface. Floors are the newest releases verified on 2026-10-09 and re-verified on 2026-10-17
# (see docs/DEPENDENCY_PROVENANCE.md); caps are the next incompatible major/minor line.
dependencies = [
    "typer>=0.27.3,<0.30",
    "pydantic>=2.14.1,<3",
    "rich>=15.0.0,<16",  # imported directly (tables, text); typer also depends on it
]

[project.scripts]
acf-local = "acf_cli.main:run"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
    "mypy>=2.4.0",
    "ruff>=0.17.1",
]

[tool.hatch.version]
path = "src/acf_cli/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/acf_cli"]

[tool.hatch.build.targets.sdist]
include = ["src/acf_cli", "tests", "main.py", "README.md", "pyproject.toml", "uv.lock"]

# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "PERF", "PL", "TID",
    "T20", "ARG", "S", "ANN", "ERA", "PIE", "RET", "TRY", "FBT", "DTZ", "ISC", "ICN", "G", "LOG",
]
ignore = [
    "TRY003",  # long messages in exception constructors are fine for a CLI
    "FBT001", "FBT002",  # boolean flags are idiomatic in Typer commands
    "PLR0913", "PLR0917",  # Typer commands legitimately take many options (invoked by keyword)
    "N818",  # exception names mirror the contract vocabulary (Rejected, OutcomeUnknown, ...) on purpose
    "RET505",  # explicit else after return is sometimes clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311", "S603", "S607", "PLR2004", "ANN", "ARG", "FBT", "T20", "PLR0915", "S108", "SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["acf_cli"]

# --------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests", "main.py"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
timeout = 60
markers = [
    "e2e: runs the real Rust host (acf-host-fake binary) over a real Unix socket; skipped if it is not built",
]

[tool.coverage.run]
source = ["acf_cli"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
