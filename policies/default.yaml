# Agent Compute Fabric — Phase 1 default policy (schema_version 1).
#
# Policy answers one question: WHAT MAY A CALLER DO, AND HOW MUCH MAY IT CONSUME?
# It is not where the machine's size lives (that is `envelope:` in config/host.example.yaml) and it
# is not where the caller's identity comes from (that is the kernel's SO_PEERCRED on the socket).
#
# How the host uses this file
#   * It is loaded through the trusted-file path: it must be a regular file (no symlink), owned by
#     root, not group/world-writable, inside root-owned, non-writable directories, and <= 1 MiB.
#     Install it with:  install -m 0644 -o root -g root policies/default.yaml /etc/acf/policy.yaml
#   * Its identity is the sha256 of the verified bytes. Every operation records that digest and keeps
#     the policy it was ADMITTED under; reloading the file never changes a run already admitted.
#   * Unknown keys are rejected (deny_unknown_fields). A typo fails loudly at load, never silently.
#
# Denial classes (what a caller sees):
#   a capability that is not granted      -> AUTHORIZATION       (images, network_modes, exec, ...)
#   a request above a ceiling             -> ADMISSION_REJECTED  (limits.*)
#   a malformed request                   -> VALIDATION
# Limits are NEVER clamped silently: a request for more than the ceiling is refused, not shrunk.

schema_version: 1
name: default
version: "1.0.0"

# ----------------------------------------------------------------------------------------------
# Ceilings. Per sandbox / per command. The milestone command
#   acf-local run --image python --cpu 2 --memory 4096 --network none --command "python x.py"
# must fit under these, so max_memory_mib is 4096 on purpose.
#
# Keep every ceiling <= the host envelope (config/host.example.yaml). A policy that permits more
# than the machine can ever schedule only turns a clear "above policy" refusal into a confusing
# "no capacity" one; the Rust test `shipped_files` enforces that for the shipped pair.
# ----------------------------------------------------------------------------------------------
limits:
  max_vcpus: 4              # Firecracker accepts 1 or an even number; admission enforces that too.
  max_memory_mib: 4096
  max_disk_mib: 8192        # must be >= the largest installed image's root filesystem
  max_runtime_ms: 3600000   # one command may run at most 1 hour
  max_pids: 1024            # process-tree cap inside the guest (per command)
  max_stdout_bytes: 8388608 # 8 MiB. stdout+stderr must fit in ONE response frame (~47 MiB raw),
  max_stderr_bytes: 8388608 # otherwise a run could succeed and still be undeliverable: refused at load.
  max_argv_items: 256
  max_argv_bytes: 131072    # 128 KiB of argv in total
  max_env_entries: 32

# ----------------------------------------------------------------------------------------------
# Defaults applied when the caller does not say. Optional: when omitted they are derived as
# min(built-in, ceiling). Spelled out here so the effective behaviour is reviewable in one place.
# Each must be <= its ceiling (checked at load).
# ----------------------------------------------------------------------------------------------
defaults:
  runtime_ms: 600000        # 10 minutes
  pids: 256
  stdout_bytes: 1048576     # 1 MiB
  stderr_bytes: 1048576

# ----------------------------------------------------------------------------------------------
# Capabilities: an allow-list. Anything not named here is denied.
# ----------------------------------------------------------------------------------------------
capabilities:
  # Phase 1 has exactly one network mode: `none` (no network device exists in the guest at all).
  # Adding a mode is a contract change that must ship with its own adversarial tests.
  network_modes: [none]
  # Image ALIASES a caller may select. An alias grants nothing by itself: the image must also be
  # installed (scripts/build-image.sh) and its manifest digests must verify at use.
  images: [base, python, node, browser]
  exec: true
  snapshot_create: true
  snapshot_restore: true
  snapshot_delete: true
  sandbox_destroy: true

# ----------------------------------------------------------------------------------------------
# How commands run inside the guest. The guest agent runs every command as this unprivileged
# identity; guest root is never available to a caller (guest_uid 0 is refused at load).
# ----------------------------------------------------------------------------------------------
execution:
  # Exact variable NAMES a caller may set. Everything else is refused, notably LD_PRELOAD,
  # LD_LIBRARY_PATH, PYTHONPATH, NODE_OPTIONS and BASH_ENV, which turn "set an env var" into
  # "run attacker-chosen code before main()" — add to this list only after thinking about that.
  env_allowlist: [PATH, HOME, LANG, LC_ALL, TZ, PYTHONUNBUFFERED, PYTHONHASHSEED, NODE_ENV, CI]
  # A command's working directory must be one of these or beneath one (no `..`, no relative paths).
  cwd_prefixes: [/workspace, /tmp]
  default_cwd: /workspace
  guest_uid: 1000
  guest_gid: 1000
