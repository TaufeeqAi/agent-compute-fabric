[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"

[project]
name = "acf-api"
dynamic = ["version"]
description = "The interface plane of Agent Compute Fabric: the core (credentials, access policy, request ledger, host binding) and the REST adapter of the edge."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Agent Compute Fabric contributors" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
# The core holds a credential for every project of a deployment, so every dependency is supply-chain
# surface. What is here: validation (pydantic), configuration files (PyYAML), the HTTP stack of the edge
# (starlette on uvicorn) and token verification for the optional OAuth mode (PyJWT with cryptography).
# TLS and the store (SQLite) are the standard library's. Floors are the newest releases found on PyPI on
# 2026-11-19 (docs/platform/DEPENDENCY_PROVENANCE.md describes the method); caps are the next
# incompatible line. The lock file fixes every version and every file by its hash.
dependencies = [
    "pydantic>=2.14.4,<3",
    "PyYAML>=6.0.3,<7",
    "starlette>=1.10.0,<2",
    "uvicorn>=0.54.0,<0.55",
    "PyJWT[crypto]>=2.15.1,<3",
]

[project.optional-dependencies]
# Telemetry is emitted through the OpenTelemetry API only when the operator installs it.
otel = ["opentelemetry-api>=1.45.2,<2"]

[project.scripts]
acf-api = "acf_api.cli:main"

[dependency-groups]
dev = [
    # Only so that the tests can show what a span carries when an operator installed OpenTelemetry.
    "opentelemetry-api>=1.45.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-timeout>=2.4.0",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.170.15",
    "jsonschema>=4.26.0",
    "types-jsonschema>=4.26.0.20261006",
    "types-PyYAML>=6.0.12.20261113",
    "openapi-spec-validator>=0.9.0",
    "httpx2>=2.16.2",
    "mypy>=2.4.1",
    "ruff>=0.17.6",
]

# What a cached build of this package depends on. uv watches only pyproject.toml by default, and this
# package's version and all of its code live under src/: without this, an install that is not editable
# (a deployment, or the agent-protocol adapter's environment, which installs this package from its directory) could be given a build of an older source tree.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**" }]

[tool.hatch.version]
path = "src/acf_api/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/acf_api"]

[tool.hatch.build.targets.sdist]
include = ["src/acf_api", "tests", "README.md", "pyproject.toml", "uv.lock"]

# --------------------------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "PERF", "PL", "TID",
    "T20", "ARG", "S", "ANN", "ERA", "PIE", "RET", "TRY", "FBT", "DTZ", "ISC", "ICN", "G", "LOG", "ASYNC",
]
ignore = [
    "TRY003",  # explicit messages in exception constructors are fine
    "N818",  # exception names mirror the contract vocabulary (Refused, LostAnswer, ...) on purpose
    "RET505",  # explicit else after return is sometimes clearer
    "PLR0913", "PLR0917",  # pipeline steps and table rows legitimately take many arguments
    "TRY300",  # a return inside try is the clearest form of "this is what success returns"
    "TRY301",  # raising inside a try to reach its own handler keeps one exit path per outcome
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "S311", "S603", "S607", "PLR2004", "ANN", "ARG", "FBT", "T20", "PLR0915", "SLF001", "E501", "PLC0415", "TID251"]
"src/acf_api/core/**" = ["TID251"]
"src/acf_api/contract/**" = ["TID251", "E501"]
"src/acf_api/cli.py" = ["TID251"]
"src/acf_api/command/model.py" = ["E501"]
"src/acf_api/core/agent/catalog.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["acf_api"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The edge role holds nothing. A static rule, beside the test that walks the import graph.
"acf_api.core".msg = "only the core process imports acf_api.core; an edge module must not"

# --------------------------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# --------------------------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 60
markers = [
    "host: runs against the in-memory test host (the acf-host-fake binary named by $ACF_HOST_FAKE) over mutual TLS; skipped without it unless ACF_REQUIRE_HOST=1",
    "proves(*test_ids, level=None): the entries of the contract's test catalog this test proves, for example proves('T3-IDM-01'); `level` (L0 to L3) says which part when the entry has several, and defaults to the level of the file (tests/test_contract_gates.py reads these)",
]

[tool.coverage.run]
source = ["acf_api"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[[tool.mypy.overrides]]
# Present only where an operator installed it; the core runs without it.
module = "opentelemetry.*"
ignore_missing_imports = true
