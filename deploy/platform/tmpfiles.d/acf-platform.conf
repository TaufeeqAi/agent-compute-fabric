# systemd-tmpfiles: the directories of the developer platform.
#   install -D -m 0644 deploy/platform/tmpfiles.d/acf-platform.conf /etc/tmpfiles.d/acf-platform.conf && systemd-tmpfiles --create acf-platform.conf
#
# The paths are the ones config/platform-core.example.yaml and config/platform-edge.example.yaml name,
# and the ones the units make writable or hide: change them in all three places together. No entry has
# an age: nothing below is ever cleaned up by systemd-tmpfiles.
#
#Type Path                           Mode  User      Group        Age
#
# Configuration. The directory is root's: no account of the platform can add or replace a file in it.
# Install core.yaml as root:acf-core 0640, rest.yaml as root:acf-rest 0640, mcp.yaml as root:acf-mcp 0640.
d      /etc/acf-platform              0755  root      root         -
# The grant templates (policies/defaults/*.yaml in the source tree), mode 0644. They hold no secret, and
# they decide what a new developer or agent may do: only root writes them.
d      /etc/acf-platform/policies     0755  root      root         -
# The core's secrets: the fingerprint key, the platform's certificate and private key as enrolled on the
# host, and the authority that signs the host's certificate. Each file is the core's and mode 0600 (the
# certificates may be 0644); the core refuses to start if one is readable by anybody else.
d      /etc/acf-platform/secrets      0700  acf-core  acf-core     -
# The TLS key and certificate of each edge endpoint: the one secret an edge holds, and only its own.
d      /etc/acf-platform/rest         0700  acf-rest  acf-rest     -
d      /etc/acf-platform/mcp          0700  acf-mcp   acf-mcp      -

# The command socket and the admin socket. Traversable by the command group and by nobody else. The
# set-group-id bit gives every socket made here the command group from its first moment; the command
# socket is then opened to that group (0660) and the admin socket stays the core's alone (0600).
d      /run/acf-platform              2750  acf-core  acf-command  -

# The interface store: the security registry, the request ledger and the audit outbox. The core's alone.
# This is the directory a backup and a restore cover.
d      /var/lib/acf-platform          0700  acf-core  acf-core     -
# The security journal. A directory of its own on purpose: a restore of the store must never overwrite
# it. Mount a separate volume here if you can.
d      /var/lib/acf-platform-journal  0700  acf-core  acf-core     -
# Audit records delivered from the outbox, when `audit_sink.file` is configured.
d      /var/log/acf-platform          0750  acf-core  acf-core     -
