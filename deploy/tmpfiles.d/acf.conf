# systemd-tmpfiles: the runtime and state directories of the host agent.
#   install -m 0644 deploy/tmpfiles.d/acf.conf /etc/tmpfiles.d/acf.conf && systemd-tmpfiles --create acf.conf
#
# The paths are the defaults of paths.runtime_dir and paths.state_root in /etc/acf/host.yaml: change
# them here if you change them there. No entry has an age: nothing below is ever cleaned up by
# systemd-tmpfiles (an expiry ticket removed by a cleaner would be a sandbox with no enforced lifetime).
#
#Type Path             Mode  User Group Age
#
# The runtime directory holds the local socket, so it must be traversable (0755): whoever is meant
# to reach the socket has to get to it. The socket itself is created 0600 by the core and then set
# to edge.socket_mode / edge.socket_gid. This entry must exist before any role starts: a role that
# found the directory missing would create it 0700 together with its own private subdirectory.
d      /run/acf         0755  root root  -
# One bind-mounted file per sandbox: the handle that keeps its network namespace alive. Root only.
d      /run/acf/netns   0700  root root  -
# Expiry tickets, written by the core and enforced by acf-lifetime.service, and the enforcer's
# heartbeat. Root only: a ticket names a process to end.
d      /run/acf/expiry  0700  root root  -
# Durable state: the store, sandboxes, snapshots (guest memory!), images, execution output and the
# event log. Root only: `acf-host doctor` FAILS (state_root) if group or other can access it.
d      /var/lib/acf     0700  root root  -
