# systemd-sysusers: the identities the host agent needs.
#   install -m 0644 deploy/sysusers.d/acf.conf /etc/sysusers.d/acf.conf && systemd-sysusers acf.conf
# (`scripts/host-setup.sh install` does both; `scripts/host-setup.sh user` creates them on a machine
# without systemd-sysusers and prints the ids.)
#
# Ids are allocated by the system ("-"): system accounts lie far below the two per-sandbox ranges
# (firecracker.uid_range_start and network.traffic_uid_start in host.yaml, 100000 and 200000 by
# default), which must not contain any account. `acf-host doctor` checks that (uid_range,
# traffic_uid_range, edge_identity).
#
#Type Name      ID  GECOS                                Home  Shell
#
# The edge: the only process that reads bytes from a caller. The core starts it under this user and
# its group, with no capability and no supplementary group. Put the ids systemd-sysusers allocated
# into host.yaml as edge.uid and edge.gid (`id -u acf-edge`, `id -g acf-edge`): a core that runs as
# root refuses to start without edge.uid. Nothing is, or should be, owned by this user.
u     acf-edge  -   "ACF host agent edge (unprivileged)"  -     -

# Optional: a group for local callers. It grants nothing by itself. To let its members reach the
# local socket set edge.socket_gid in host.yaml to this group's id (`getent group acf`); what they
# may then do is decided by an entry in /etc/acf/enrolment.yaml that matches their uid or primary
# gid, never by the socket's permissions. Delete this line if only root calls the host locally.
g     acf       -   -
