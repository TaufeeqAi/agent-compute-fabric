# systemd-tmpfiles: directories the host agent expects.
#   install -m 0644 deploy/tmpfiles.d/acf.conf /etc/tmpfiles.d/acf.conf && systemd-tmpfiles --create acf.conf
#
# Type Path            Mode  User Group Age
# /run/acf holds the control socket. It must be traversable (0755) so members of the configured
# socket group can reach the socket; the socket file itself is created 0600 and then set to
# security.socket_mode / security.socket_gid by the agent.
d      /run/acf        0755  root root  -
# Persistent network-namespace handles (one bind-mounted file per VM jail). Root only.
d      /run/acf/netns  0700  root root  -
# Durable state: journal, sandboxes, snapshots (guest memory!), images, telemetry. Root only:
# `acf-host doctor` FAILS if this directory is accessible by group/other.
d      /var/lib/acf    0700  root root  -
