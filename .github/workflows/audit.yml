# Known-vulnerability audit of everything this repository locks: Cargo.lock, the uv.lock of the tooling
# and of the host client, and the five locks of the developer platform (four uv.lock files and one
# package-lock.json).
#
# Weekly, and whenever a lock file changes. It is separate from ci.yml on purpose: an advisory published
# today must not turn yesterday's unrelated pull request red, but it must reach a human quickly.
# (`cargo audit` and `pip-audit` read advisory databases over the network, so this cannot run offline.)
name: audit

on:
  schedule:
    - cron: "17 4 * * 1"
  push:
    branches: [main]
    paths:
      - Cargo.lock
      - uv.lock
      - apps/host-cli/uv.lock
      - apps/api/uv.lock
      - apps/mcp-gateway/uv.lock
      - apps/cli/uv.lock
      - sdks/python/uv.lock
      - sdks/typescript/package-lock.json
      - .github/workflows/audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    name: cargo audit (RustSec)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # --locked: build cargo-audit from its own published lock file; the version is pinned (verified 2026-10-14).
      - name: Install cargo-audit
        run: cargo install --locked cargo-audit --version 0.23.0
      - name: Audit Cargo.lock (warnings, such as unmaintained crates, fail the job too)
        run: cargo audit --deny warnings

  python:
    name: pip-audit (PyPI advisories)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - name: Audit the CLI's locked dependencies (runtime supply-chain surface)
        run: |
          set -euo pipefail
          uv --directory apps/host-cli export --locked --no-dev --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/cli-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --requirement "$RUNNER_TEMP/cli-requirements.txt" --no-deps --disable-pip --strict
      - name: Audit the repository tooling's locked dependencies
        run: |
          set -euo pipefail
          uv export --locked --no-emit-project --format requirements-txt -o "$RUNNER_TEMP/tools-requirements.txt"
          uvx --from pip-audit==2.10.1 pip-audit --requirement "$RUNNER_TEMP/tools-requirements.txt" --no-deps --disable-pip --strict

  platform:
    name: pip-audit and npm audit (the developer platform's five locks)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.13.1"
      # The same target the release workflow runs before it publishes anything: the API, the
      # agent-protocol adapter, the Python SDK and the CLI through pip-audit, the TypeScript SDK through
      # `npm audit` and `npm audit signatures`. Development tools are audited too: they run in the
      # pipeline that builds what is published.
      - run: make platform-audit
